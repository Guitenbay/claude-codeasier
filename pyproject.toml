[project]
name = "claude-codeasier"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/session/scripts"]

[tool.basedpyright]
pythonVersion = "3.11"
include = ["plugins/session/scripts", "tests"]
exclude = [".git"]
