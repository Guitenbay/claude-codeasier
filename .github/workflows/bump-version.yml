name: Bump plugin versions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-versions:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect changed plugins
        id: detect
        run: |
          plugins=$(git diff --name-only HEAD~1 HEAD \
            | grep -oP '^plugins/\K[^/]+' \
            | sort -u)
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "Changed plugins: $plugins"

      - name: Update plugin versions
        if: steps.detect.outputs.plugins != ''
        id: update
        run: |
          for name in ${{ steps.detect.outputs.plugins }}; do
            f="plugins/$name/.claude-plugin/plugin.json"
            [ -f "$f" ] || continue
            current=$(jq -r '.version' "$f")
            base=$(echo "$current" | sed -E 's/\.[0-9a-f]{4,}$//')
            new_version="${base}.${{ steps.sha.outputs.short }}"
            [ "$current" = "$new_version" ] && continue
            jq --arg v "$new_version" '.version = $v' "$f" > tmp.json && mv tmp.json "$f"
            echo "$f: $current -> $new_version"
          done

      - name: Commit and push
        if: steps.detect.outputs.plugins != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/*/.claude-plugin/plugin.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump plugin versions [skip ci]"
          git push
